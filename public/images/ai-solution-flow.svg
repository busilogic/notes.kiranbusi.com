  <line x1="420" y1="246" x2="420" y2="306" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="590" y1="246" x2="680" y2="306" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>

