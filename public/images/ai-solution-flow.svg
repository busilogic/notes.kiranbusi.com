  <!-- Project 1 -->
  <rect x="40" y="312" width="210" height="140" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="58" y="326" width="174" height="44" rx="6" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="145" y="345" text-anchor="middle" fill="#111827" font-size="12" font-family="monospace">agents.md</text>
