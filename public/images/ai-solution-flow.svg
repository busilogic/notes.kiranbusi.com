<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 500" font-family="'Segoe UI', 'Inter', Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L8,3.5 z" fill="#374151"/>
    </marker>
    <marker id="arr-dash" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L8,3.5 z" fill="#9ca3af"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1060" height="500" fill="#f9fafb" rx="12"/>
  <rect x="16" y="16" width="1028" height="468" fill="#ffffff" rx="8" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Title -->
  <text x="530" y="50" text-anchor="middle" fill="#111827" font-size="15" font-weight="700">The architecture — two layers, one source of truth per project</text>

  <!-- ==================== INPUT ROW ==================== -->
  <!-- cli -->
  <rect x="80" y="72" width="100" height="44" rx="7" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="130" y="99" text-anchor="middle" fill="#374151" font-size="13">⌨  cli</text>

  <!-- Chat / GUI -->
  <rect x="200" y="72" width="130" height="44" rx="7" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="265" y="99" text-anchor="middle" fill="#374151" font-size="13">🖥  Chat / GUI</text>

  <!-- Integrations -->
  <rect x="350" y="72" width="140" height="44" rx="7" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="420" y="99" text-anchor="middle" fill="#374151" font-size="13">🔗  Integrations</text>

  <!-- Terminal -->
  <rect x="510" y="72" width="120" height="44" rx="7" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="570" y="99" text-anchor="middle" fill="#374151" font-size="13">⊞  Terminal</text>

  <!-- inbox.md -->
  <rect x="650" y="72" width="120" height="44" rx="7" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="710" y="99" text-anchor="middle" fill="#374151" font-size="12" font-family="monospace">inbox.md</text>

  <!-- ==================== ARROWS TO ORCHESTRATOR ==================== -->
  <line x1="130" y1="116" x2="310" y2="186" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="265" y1="116" x2="360" y2="186" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="420" y1="116" x2="420" y2="186" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="570" y1="116" x2="480" y2="186" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="710" y1="116" x2="530" y2="186" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ==================== ORCHESTRATOR ==================== -->
  <rect x="160" y="190" width="520" height="56" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="420" y="215" text-anchor="middle" fill="#111827" font-size="14" font-weight="600">Orchestrator</text>
  <text x="420" y="235" text-anchor="middle" fill="#92400e" font-size="11">Personal GitHub — inbox, daily view, engagement issues, operational notes</text>

  <!-- ==================== DASHED LINE TO PANEL ==================== -->
  <line x1="680" y1="218" x2="762" y2="218" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arr-dash)"/>

  <!-- ==================== ACTIVE PROJECTS PANEL ==================== -->
  <text x="900" y="152" text-anchor="middle" fill="#374151" font-size="13" font-weight="600">Active Projects</text>

  <rect x="768" y="160" width="264" height="42" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="900" y="184" text-anchor="middle" fill="#1d4ed8" font-size="12">Client A — Azure migration</text>

  <rect x="768" y="208" width="264" height="42" rx="6" fill="#fdf4ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="900" y="232" text-anchor="middle" fill="#7e22ce" font-size="12">Client B — Platform hypercare</text>

  <rect x="768" y="256" width="264" height="42" rx="6" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="900" y="280" text-anchor="middle" fill="#c2410c" font-size="12">Client C — Mid-migration</text>

  <rect x="768" y="304" width="264" height="52" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="900" y="328" text-anchor="middle" fill="#15803d" font-size="12">Admin &amp; cross-cutting</text>
  <text x="848" y="348" fill="#6b7280" font-size="11" text-decoration="underline">View repo</text>
  <text x="930" y="348" fill="#6b7280" font-size="11" text-decoration="underline">View plan</text>

