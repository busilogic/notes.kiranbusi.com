  <text x="104" y="303" fill="#6b7280" font-size="11">Company Org</text>
  <text x="364" y="303" fill="#6b7280" font-size="11">Company Org</text>
  <text x="624" y="303" fill="#6b7280" font-size="11">Company Org</text>

