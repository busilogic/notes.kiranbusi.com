  <rect x="310" y="312" width="210" height="140" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="328" y="326" width="174" height="44" rx="6" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="415" y="345" text-anchor="middle" fill="#111827" font-size="12" font-family="monospace">agents.md</text>
  <text x="415" y="361" text-anchor="middle" fill="#92400e" font-size="10">project context · conventions</text>
  <rect x="328" y="378" width="174" height="44" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="415" y="397" text-anchor="middle" fill="#111827" font-size="12">GitHub Copilot</text>
  <text x="415" y="413" text-anchor="middle" fill="#1d4ed8" font-size="10">company-licensed · compliant</text>

  <!-- Project 3 -->
  <rect x="580" y="312" width="210" height="140" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="598" y="326" width="174" height="44" rx="6" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="685" y="345" text-anchor="middle" fill="#111827" font-size="12" font-family="monospace">agents.md</text>
  <text x="685" y="361" text-anchor="middle" fill="#92400e" font-size="10">project context · conventions</text>
  <rect x="598" y="378" width="174" height="44" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="685" y="397" text-anchor="middle" fill="#111827" font-size="12">GitHub Copilot</text>
  <text x="685" y="413" text-anchor="middle" fill="#1d4ed8" font-size="10">company-licensed · compliant</text>

  <!-- ==================== CAPTION ==================== -->
  <text x="530" y="476" text-anchor="middle" fill="#9ca3af" font-size="11">The orchestrator is yours. The project repos belong to the company. The agents.md is the bridge between them.</text>
</svg>
